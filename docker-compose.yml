version: '2.4'

services:
  cache:
    restart: always
    image: redis:7.0-alpine
    container_name: fdsnws-availability-cache
    network_mode: "host"
    command: redis-server --save 20 1 --loglevel warning
  cacher:
    build:
      context: ./
      dockerfile: Dockerfile.cacher
    restart: always
    container_name: fdsnws-availability-cacher
    network_mode: "host"
    environment:
      RUNMODE: production
      # Host Networking: Redis is on localhost
      CACHE_HOST: "127.0.0.1"
      # Limit OpenBLAS threads (Fix for Cacher Crash)
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ulimits:
      nproc: 65535
    security_opt:
      - seccomp:unconfined
  api:
    build:
      context: ./
      dockerfile: Dockerfile.api
    restart: always
    # Worker Configuration:
    # - Default: 1 worker (most stable for resource-constrained servers)
    # - Moderate: 2-3 workers (recommended if no thread creation issues)
    # - High-performance: (2 × CPU cores) + 1 workers
    # See README.md "Performance Tuning" section for details
    command: gunicorn --bind 0.0.0.0:9001 --workers 1 --timeout 600 start:app
    container_name: fdsnws-availability-api
    network_mode: "host"
    environment:
      RUNMODE: production
      # Host Networking: Redis is on localhost
      CACHE_HOST: "127.0.0.1"
      # MongoDB / FDSNWS-Station / Sentry settings are read from config.py.
      # Do NOT add MONGODB_* or FDSNWS_STATION_URL here — env vars set in this
      # block take precedence over config.py and would silently override the
      # operator's settings.
      # Limit OpenBLAS threads to prevent "pthread_create failed" on restricted servers
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    security_opt:
      - seccomp:unconfined
    mem_limit: 2g
    memswap_limit: 2g

